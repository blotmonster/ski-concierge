<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ski Concierge</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">

    <!-- HEADER -->
    <h1>🎿 Ski Concierge</h1>
    <div class="subtitle">We’ll match you intelligently.</div>

    <!-- TRAVEL TYPE PANEL -->
    <div class="panel">
      <h2>Travel Type</h2>

      <label>Travel Mode</label>
      <select id="travelType">
        <option value="drive">Drive</option>
        <option value="fly">Fly</option>
      </select>

      <label>ZIP Code</label>
      <input type="text" id="zipCode" placeholder="e.g. 02482" />

      <label>Max Drive Time</label>
      <select id="driveTime">
        <option value="2">Under 2 hours</option>
        <option value="3">Under 3 hours</option>
        <option value="4">Under 4 hours</option>
        <option value="6">Under 6 hours</option>
      </select>
    </div>

    <!-- SKI PROFILE PANEL -->
    <div class="panel">
      <h2>Ski Profile</h2>

      <label>Ability</label>
      <select id="ability">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>

      <label>Terrain Preference</label>
      <select id="terrainPreference">
        <option value="groomers">Groomers</option>
        <option value="mixed">Mixed</option>
        <option value="expert">Expert Terrain</option>
      </select>

      <label>Crowd Tolerance</label>
      <select id="crowdTolerance">
        <option value="low">Low – Avoid Crowds</option>
        <option value="medium">Medium</option>
        <option value="high">High – Don’t Care</option>
      </select>

      <label>Luxury Importance</label>
      <select id="luxuryImportance">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <label>Snow Reliability Importance</label>
      <select id="snowImportance">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <label>Pass</label>
      <select id="passPreference">
        <option value="any">Any</option>
        <option value="Epic">Epic</option>
        <option value="Ikon">Ikon</option>
        <option value="Indy">Indy</option>
        <option value="None">Independent</option>
      </select>

      <button id="findButton">Find My Mountains</button>
    </div>

    <!-- BEST MATCH SECTION (FIXED STRUCTURE) -->
    <div class="best-match-section">
      <h2>🏆 Best Overall Match</h2>

      <div class="best-match-card">
        <img id="bestHeroImage" src="" alt="Best Mountain Image">

        <div class="best-match-overlay">
          <h3 id="bestMountainName"></h3>
          <div class="match-score" id="bestMatchScore"></div>
          <ul class="reason-list" id="bestReasons"></ul>
        </div>
      </div>
    </div>

    <!-- TOP OVERALL MATCHES -->
    <div class="results-section">
      <h3>🔥 Top Overall Matches</h3>
      <ul class="results-list" id="topMatchesList"></ul>
    </div>

    <!-- RESULTS BY STATE -->
    <div class="results-section">
      <h3>🗺️ Top Results by State</h3>
      <div id="resultsByState"></div>
    </div>

  </div>

  <!-- DATA + ENGINE + UI -->
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="ui.js"></script>

</body>
</html>
